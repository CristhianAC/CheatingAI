version: "3.9"

services:
  redis:
    image: redis:7.2-alpine
    container_name: cheating_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: cheating_ai_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/cheating_ai.db
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
    volumes:
      - db_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: cheating_ai_worker
    command: >
      celery -A app.tasks.celery_app worker
      --loglevel=info
      --queues=plagiarism
      --concurrency=2
    environment:
      - DATABASE_URL=sqlite:////app/data/cheating_ai.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - db_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: cheating_ai_flower
    command: >
      celery -A app.tasks.celery_app flower
      --port=5555
      --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    restart: unless-stopped

volumes:
  redis_data:
  db_data:
